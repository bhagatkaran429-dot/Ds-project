
<!DOCTYPE html>
<html>
<head>
    <title>Student Record Management System</title>
</head>
<body>

    <h1 align="center">Student Record Management System</h1>
    <hr>

    <h2>Add Student Record</h2>

    <form>
        <label>Roll Number:</label><br>
        <input type="number" id="roll"><br><br>

        <label>Student Name:</label><br>
        <input type="text" id="name"><br><br>

        <label>Marks:</label><br>
        <input type="number" id="marks"><br><br>

        <button type="button" onclick="addStudent()">Add Student</button>
    </form>

    <hr>

    <h2>Search Student</h2>
    <input type="text" id="search" placeholder="Enter Roll Number">
    <button onclick="searchStudent()">Search</button>

    <hr>

    <h2>Student Records</h2>

    <table border="1" cellpadding="10" width="100%">
        <thead>
            <tr>
                <th>Roll Number</th>
                <th>Student Name</th>
                <th>Marks</th>
                <th>Result</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="studentList"></tbody>
    </table>

    <script>
        let students = [];

        function addStudent() {
            let roll = document.getElementById("roll").value;
            let name = document.getElementById("name").value.trim();
            let marks = Number(document.getElementById("marks").value);

            if (!roll || !name || marks < 0 || marks > 100 ||
                document.getElementById("marks").value === "") {
                alert("Please enter valid student details!");
                return;
            }

            if (students.some(s => s.roll === roll)) {
                alert("Roll Number already exists!");
                return;
            }

            students.push({roll, name, marks});
            displayStudents();

            document.getElementById("roll").value = "";
            document.getElementById("name").value = "";
            document.getElementById("marks").value = "";
        }

        function displayStudents() {
            let list = document.getElementById("studentList");
            list.innerHTML = "";

            students.forEach((s, index) => {
                let result = s.marks >= 35 ? "Pass" : "Fail";

                list.innerHTML += `
                <tr>
                    <td>${s.roll}</td>
                    <td>${escapeHTML(s.name)}</td>
                    <td>${s.marks}</td>
                    <td>${result}</td>
                    <td>
                        <button onclick="editStudent(${index})">Update</button>
                        <button onclick="deleteStudent(${index})">Delete</button>
                    </td>
                </tr>`;
            });
        }

        function escapeHTML(value) {
            return value.replace(/[&<>"']/g, char => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            })[char]);
        }

        function searchStudent() {
            let roll = document.getElementById("search").value.trim();

            let student = students.find(s => s.roll === roll);

            if (student) {
                alert(
                    "Roll Number: " + student.roll +
                    "\nName: " + student.name +
                    "\nMarks: " + student.marks
                );
            } else {
                alert("Student Not Found!");
            }
        }

        function editStudent(index) {
            let student = students[index];

            document.getElementById("roll").value = student.roll;
            document.getElementById("name").value = student.name;
            document.getElementById("marks").value = student.marks;

            students.splice(index, 1);
            displayStudents();
        }

        function deleteStudent(index) {
            if (confirm("Are you sure you want to delete?")) {
                students.splice(index, 1);
                displayStudents();
            }
        }
    </script>

</body>
</html>
